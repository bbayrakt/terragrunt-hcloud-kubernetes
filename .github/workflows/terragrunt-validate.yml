# Terragrunt Validate (Staging)
#
# Validates Terragrunt HCL syntax and Terraform configuration for all staging
# stacks on every PR touching staging or shared modules. Split into two jobs:
#
#   lint  — ungated, no secret access, runs immediately on every PR
#           (terragrunt hcl format --check, terragrunt hcl validate)
#
#   validate — gated behind a required-reviewer GitHub Environment,
#              has SOPS decrypt access (terragrunt validate --all)
#
# See docs/plans/2026-08-02-001-feat-renovate-dependency-updates-staging-plan.md
# for the full design rationale.

name: Terragrunt Validate (Staging)

on:
  pull_request:
    paths:
      - infra/environments/staging/**
      - infra/modules/**
      - platform/**
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: HCL Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Install Terragrunt
        run: |
          TERRAGRUNT_VERSION="v1.1.2"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: HCL Format Check
        run: terragrunt hcl format --check

      # Scoped to staging: terragrunt hcl validate from the repo root also validates
      # production, whose configs currently reference inputs/secrets that don't exist
      # yet (pre-existing, out of scope — see docs/plans/2026-08-02-001-...-plan.md).
      - name: HCL Validate (staging)
        working-directory: infra/environments/staging
        run: terragrunt hcl validate

  validate:
    name: Terragrunt Validate
    needs: lint
    runs-on: ubuntu-latest
    environment: ci-secrets-staging
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Install Terragrunt
        run: |
          TERRAGRUNT_VERSION="v1.1.2"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Install sops
        run: |
          SOPS_VERSION="v3.13.3"
          curl -sL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Terragrunt Validate
        working-directory: infra/environments/staging
        run: |
          terragrunt init -reconfigure
          terragrunt validate --all