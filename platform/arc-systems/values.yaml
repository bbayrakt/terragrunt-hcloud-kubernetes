gha-runner-scale-set-controller:
  # Explicit resource requests/limits (docs/resource-management-policy.md): CPU request only, no
  # CPU limit (avoids throttling on spare node capacity; memory OOM-kill is the real crash risk
  # this closes, not CPU contention). `resources` is a single top-level key for this chart
  # (verified via `helm show values` for the pinned 0.13.1 version) -- the chart's own comment
  # recommends leaving it unset only so environments like Minikube aren't forced into a floor;
  # this repo's constrained cluster is exactly the case that comment anticipates. Starting values
  # are a conservative, research-grounded estimate (see
  # docs/plans/2026-08-01-002-feat-helm-chart-resource-management-plan.md); refine via VPA
  # recommender data (platform/arc-systems/templates/vpa.yaml) once it has accumulated history.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
